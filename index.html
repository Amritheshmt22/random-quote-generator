<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Quote Generator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <h1 class="app-title">Random Quote Generator</h1>
    <p class="app-subtitle">A little inspiration, one quote at a time.</p>

    <section class="quote-card" aria-live="polite">
      <blockquote id="quoteText" class="quote-text"></blockquote>
      <p id="quoteAuthor" class="quote-author"></p>
    </section>

    <div class="actions">
      <button id="newQuoteBtn" class="btn btn-primary" type="button">New Quote</button>
      <button id="copyBtn" class="btn btn-secondary" type="button">Copy</button>
    </div>

    <p id="feedback" class="feedback" role="status"></p>
    <p class="hint">Tip: press <kbd>N</kbd> for a new quote</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
